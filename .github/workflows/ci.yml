name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (no network, no API keys)
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t london-tube-assistant .
      - name: Imports work inside the image
        run: docker run --rm london-tube-assistant python -c "import tube.agent.agent, app.ui, chromadb, fastembed; print('imports ok')"
      - name: Container starts and passes its health check
        run: |
          docker run -d --name app -p 8501:8501 -e SKIP_BOOTSTRAP=1 -e LLM_API_KEY=dummy london-tube-assistant
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then echo " healthy"; exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
